# Production Spring Boot Configuration
server.port=${PORT:8080}
server.servlet.context-path=/

# Production Datasource (Defaults to MySQL / MariaDB, or can connect to hosted cloud MySQL)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smart_crm?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:crm_user}
spring.datasource.password=${DB_PASSWORD:crm_pass123}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Flyway Database Migration
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# Actuator Health
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# JWT
smartcrm.jwt.secret=${JWT_SECRET:smartCrmSuperSecretKeyThatIsAtLeast32BytesLongForHmacSha256Security!}
smartcrm.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Initial Admin Setup
smartcrm.admin.email=${ADMIN_EMAIL:admin@smartcrm.com}
smartcrm.admin.password=${ADMIN_PASSWORD:Admin@123CRM!}
smartcrm.admin.name=${ADMIN_NAME:System Administrator}

# Gemini AI
smartcrm.ai.gemini-api-key=${GEMINI_API_KEY:}
smartcrm.ai.model=${GEMINI_MODEL:gemini-1.5-flash}
smartcrm.ai.timeout-ms=${AI_TIMEOUT_MS:10000}

# CORS
smartcrm.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}
