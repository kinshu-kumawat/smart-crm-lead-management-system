server.port=${PORT:8080}
server.servlet.context-path=/

# Datasource configuration (defaults to local MariaDB/MySQL)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smart_crm?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:crm_user}
spring.datasource.password=${DB_PASSWORD:crm_pass123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Flyway Database Migration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# Actuator Health & Metrics
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# JWT Configuration
smartcrm.jwt.secret=${JWT_SECRET:smartCrmSuperSecretKeyThatIsAtLeast32BytesLongForHmacSha256Security!}
smartcrm.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Initial Admin Setup
smartcrm.admin.email=${ADMIN_EMAIL:admin@smartcrm.com}
smartcrm.admin.password=${ADMIN_PASSWORD:Admin@123CRM!}
smartcrm.admin.name=${ADMIN_NAME:System Administrator}

# Gemini AI Configuration
smartcrm.ai.gemini-api-key=${GEMINI_API_KEY:}
smartcrm.ai.model=${GEMINI_MODEL:gemini-1.5-flash}
smartcrm.ai.timeout-ms=${AI_TIMEOUT_MS:10000}

# CORS Configuration
smartcrm.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:8080}

# OpenAPI / Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
